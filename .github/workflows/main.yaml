name: release initial database

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: init
        run: make init

      - name: build
        run: make

      - name: run
        run: ./build/main

      - name: zip
        run: zip -r database.zip ./database

      - name: uploading forlder to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: database
          name: Database
          files: database.zip